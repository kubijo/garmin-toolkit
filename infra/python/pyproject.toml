[project]
name = "garmin-python-tools"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "jinja2>=3.1.6",
    "rich>=15.0.0",
    "tyro>=1.0.16",
]

[tool.uv]
package = false

[tool.basedpyright]
include = [".."]
pythonVersion = "3.14"
typeCheckingMode = "strict"
failOnWarnings = true
executionEnvironments = [
    { root = "../licenses" },
    { root = "." },
    { root = "../fixtures" },
]
