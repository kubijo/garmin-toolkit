[project]
name = "garmin-python-tools"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tyro>=1.0.16",
]

[dependency-groups]
dev = [
    "types-jsonschema>=4.26.0",
    "types-pyyaml>=6.0.12",
]

[tool.deptry.package_module_name_map]
pyyaml = ["yaml"]

[tool.uv]
package = false

[tool.basedpyright]
include = [".."]
pythonVersion = "3.14"
typeCheckingMode = "strict"
failOnWarnings = true
executionEnvironments = [
    { root = "../licenses" },
    { root = "." },
    { root = "../fixtures" },
]
