[project]
name = "garmin-python-tools"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "jinja2>=3.1.6",
    "tyro>=1.0.16",
]

[tool.uv]
package = false

[tool.basedpyright]
include = [".."]
pythonVersion = "3.14"
typeCheckingMode = "strict"
failOnWarnings = true
executionEnvironments = [
    { root = "../licenses" },
    { root = "." },
    { root = "../fixtures" },
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
