[workspace]

[package]
name = "garmin-connect-codegen"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata.cargo-machete]
# Referenced by the generated API modules under Cargo's build output.
ignored = ["chrono", "reqwest-middleware", "serde", "serde_json", "thiserror", "uuid"]

[dependencies]
bytes = { version = "=1.12.1", features = ["serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }
futures-util = "=0.3.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["query", "rustls", "stream"] }
reqwest-middleware = { version = "=0.5.2", features = ["query"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.20"
uuid = { version = "=1.26.0", features = ["serde"] }

[build-dependencies]
hex = "=0.4.3"
openapi-to-rust = { version = "=0.23.0", default-features = false }
serde_json = "=1.0.154"
sha2 = "=0.11.0"

[dev-dependencies]
indoc = "=2.0.7"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util"] }
