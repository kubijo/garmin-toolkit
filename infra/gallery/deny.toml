[graph]
all-features = true

[advisories]
version = 2
unused-ignored-advisory = "deny"

[[advisories.ignore]]
id = "RUSTSEC-2026-0370"
reason = """
Native accessibility uses zvariant 5 through AccessKit/AT-SPI and zbus 5.
No compatible published upgrade preserves that stack yet. Remove this
gallery-only exception when compatible published AccessKit/AT-SPI releases
adopt zbus 6's wire types.
Upstream: https://github.com/z-galaxy/zbus/issues/2043
"""

[[advisories.ignore]]
id = "RUSTSEC-2026-0371"
reason = """
AccessKit/AT-SPI and zbus 5 require the unmaintained standalone zbus_names.
Remove this gallery-only exception when compatible published AccessKit/AT-SPI
releases migrate to zbus 6's names module; retain native accessibility.
Upstream: https://github.com/z-galaxy/zbus/issues/2043
"""

[[advisories.ignore]]
id = "RUSTSEC-2026-0372"
reason = """
AccessKit/AT-SPI's zvariant 5 dependency requires zvariant_derive 5.
An isolated derive upgrade cannot migrate the accessibility stack. Remove
this gallery-only exception when compatible published AccessKit/AT-SPI
releases use zbus 6's derive macros.
Upstream: https://github.com/z-galaxy/zbus/issues/2043
"""

[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
private = { ignore = false }

[[licenses.clarify]]
crate = "sublime_fuzzy@0.7.0"
expression = "Apache-2.0"
license-files = [
    { path = "LICENSE", hash = 0xb40930bb },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/kubijo/rs-gallery.git"]
