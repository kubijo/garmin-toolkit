name: Bounded Nix
description: Install cached Nix and cap build workers on disposable GitHub runners.
inputs:
  kvm:
    description: Enable disposable VM tests.
    default: "false"
  haos:
    description: Install HAOS tools for x86_64-linux (also true), aarch64-linux, or all; false disables them.
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        KVM: ${{ inputs.kvm }}
        HAOS: ${{ inputs.haos }}
      run: bash infra/ci/runner.sh prepare "$KVM" "$HAOS"
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          keep-env-derivations = true
          keep-outputs = true
          system-features = nixos-test benchmark big-parallel kvm
    - uses: DeterminateSystems/magic-nix-cache-action@v15
      with:
        use-gha-cache: enabled
        use-flakehub: disabled
        diagnostic-endpoint: ""
    - name: Cap disposable runner build workers
      shell: bash
      run: bash infra/ci/runner.sh limits
