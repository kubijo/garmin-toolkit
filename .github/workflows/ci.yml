name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      sources:
        description: Export AMD64 dependency sources for pre-release audit.
        type: boolean
        default: false
      arm64_acceptance:
        description: Run bounded ARM64 HAOS installation, ingress, and lifecycle acceptance through QEMU emulation.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        group: [tooling, rust, desktop, gallery, hass]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
        with:
          kvm: ${{ matrix.group == 'hass' }}
      - name: Build checks
        env:
          CHECK_GROUP: ${{ matrix.group }}
        run: bash infra/ci/runner.sh checks "$CHECK_GROUP"
  hass-amd64:
    uses: ./.github/workflows/hass-native.yml
    with:
      sources: ${{ github.event_name == 'workflow_dispatch' && inputs.sources }}
  hass-arm64:
    uses: ./.github/workflows/hass-native.yml
    with:
      system: aarch64-linux
      runner: ubuntu-24.04-arm
      acceptance: ${{ github.event_name == 'workflow_dispatch' && inputs.arm64_acceptance }}
  check:
    needs: [checks, hass-amd64, hass-arm64]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require all checks and native images
        env:
          CHECKS: ${{ needs.checks.result }}
          AMD64: ${{ needs.hass-amd64.result }}
          ARM64: ${{ needs.hass-arm64.result }}
        run: bash infra/ci/runner.sh require-success "$CHECKS" "$AMD64" "$ARM64"
