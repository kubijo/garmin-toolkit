name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM for disposable integration tests
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true
            system-features = nixos-test benchmark big-parallel kvm
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ""
      - name: Cap Nix daemon resources
        run: |
          sudo systemctl set-property --runtime nix-daemon.service MemoryMax=6G CPUQuota=200%
          test "$(systemctl show nix-daemon.service --property MemoryMax --value)" = 6442450944
          test "$(systemctl show nix-daemon.service --property CPUQuotaPerSecUSec --value)" = 2s
      - name: Verify sandboxed source
        run: nix build -L .#checks.x86_64-linux.rust-source-closure --max-jobs 1 --cores 2 --no-update-lock-file
      - name: Check flake
        run: nix flake check -L --max-jobs 1 --cores 2 --no-update-lock-file
  hass-native-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            system: x86_64-linux
            runner: ubuntu-latest
          - architecture: aarch64
            system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ""
      - name: Cap Nix daemon resources
        run: |
          sudo systemctl set-property --runtime nix-daemon.service MemoryMax=6G CPUQuota=200%
          test "$(systemctl show nix-daemon.service --property MemoryMax --value)" = 6442450944
          test "$(systemctl show nix-daemon.service --property CPUQuotaPerSecUSec --value)" = 2s
      - name: Build and record native Home Assistant app image
        env:
          BUILD_SYSTEM: ${{ matrix.system }}
          WORKFLOW_RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          image=".#packages.$BUILD_SYSTEM.garmin-hass-app-image"
          archive="$(nix build -L "$image" \
            --no-link --print-out-paths --max-jobs 1 --cores 2 --no-update-lock-file)"
          sbom="$(nix build -L ".#packages.$BUILD_SYSTEM.garmin-hass-app-sbom" \
            --no-link --print-out-paths --max-jobs 1 --cores 2 --no-update-lock-file)"
          derivation="$(nix eval --raw "$image.drvPath" --no-update-lock-file)"
          nix run .#hass-release --max-jobs 1 --cores 2 --no-update-lock-file -- record-build \
            --source "$PWD" --archive "$archive" --sbom "$sbom" --derivation "$derivation" \
            --workflow-run "$WORKFLOW_RUN" --output .tmp/hass-native-build
      - uses: actions/upload-artifact@v7
        with:
          name: garmin-hass-native-${{ matrix.architecture }}
          path: .tmp/hass-native-build
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
