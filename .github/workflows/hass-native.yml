name: Native HASS images
on:
  workflow_call:
    inputs:
      system:
        type: string
        default: x86_64-linux
      runner:
        type: string
        default: ubuntu-latest
      release:
        type: boolean
        default: false
      sources:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nix
      - name: Build image, verify inventory, and export requested sources
        id: build
        env:
          BUILD_SYSTEM: ${{ inputs.system }}
          RELEASE: ${{ inputs.release }}
          SOURCES: ${{ inputs.sources }}
        run: nix run .#hass-ci -- native --system "$BUILD_SYSTEM" --release "$RELEASE" --sources "$SOURCES"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.build.outputs.architecture != '' }}
        with:
          name: garmin-hass-native-${{ steps.build.outputs.architecture }}
          path: .tmp/hass-native-build
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.sources == 'true'
        with:
          name: garmin-hass-sources-${{ steps.build.outputs.architecture }}
          path: .tmp/hass-native-sources
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
