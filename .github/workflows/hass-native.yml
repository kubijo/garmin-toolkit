name: Native HASS images
on:
  workflow_call:
    inputs:
      system:
        type: string
        default: x86_64-linux
      runner:
        type: string
        default: ubuntu-latest
      release:
        type: boolean
        default: false
      sources:
        type: boolean
        default: false
      acceptance:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    outputs:
      architecture: ${{ steps.build.outputs.architecture }}
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nix
      - name: Build image, verify inventory, and export requested sources
        id: build
        env:
          BUILD_SYSTEM: ${{ inputs.system }}
          RELEASE: ${{ inputs.release }}
          SOURCES: ${{ inputs.sources }}
        run: nix run .#hass-ci -- native --system "$BUILD_SYSTEM" --release "$RELEASE" --sources "$SOURCES"
      # v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && steps.build.outputs.architecture != '' }}
        with:
          name: garmin-hass-native-${{ steps.build.outputs.architecture }}
          path: .tmp/hass-native-build
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      # v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.build.outputs.sources == 'true'
        with:
          name: garmin-hass-sources-${{ steps.build.outputs.architecture }}
          path: .tmp/hass-native-sources
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  acceptance:
    if: inputs.acceptance
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nix
        with:
          kvm: ${{ inputs.system == 'x86_64-linux' }}
          haos: ${{ inputs.system }}
      # v8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: garmin-hass-native-${{ needs.native.outputs.architecture }}
          path: .tmp/native
      - name: Verify installation, ingress, and lifecycle in HAOS
        env:
          BUILD_SYSTEM: ${{ inputs.system }}
        run: nix run .#hass-ci -- acceptance --system "$BUILD_SYSTEM"
      # v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: garmin-hass-acceptance-${{ needs.native.outputs.architecture }}
          path: .tmp/native-acceptance
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
