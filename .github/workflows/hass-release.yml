name: HASS experimental release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Promote a signed tag draft; false tests a branch or builds a tag draft.
        type: boolean
        default: false
      recovery:
        description: Run isolated synthetic recovery fixtures instead of publication.
        type: boolean
        default: false
      arm64_run:
        description: Qualify a retained ARM64 artifact from this successful CI run; skips builds and publication.
        type: string
        default: ""
concurrency:
  group: hass-publication
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'kubijo/garmin-toolkit' && !inputs.publish && !inputs.recovery && inputs.arm64_run == ''
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/hass-native.yml
    with:
      system: ${{ matrix.system }}
      runner: ${{ matrix.runner }}
      release: ${{ github.ref_type == 'tag' }}
      sources: true
  release:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      DOCKER_CONFIG: ${{ github.workspace }}/.tmp/docker-auth
      REGISTRY_AUTH_FILE: ${{ github.workspace }}/.tmp/docker-auth/config.json
      TMPDIR: ${{ github.workspace }}/.tmp/runner-tmp
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nix
        with:
          kvm: "true"
          haos: all
      # v8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: garmin-hass-native-amd64
          path: .tmp/native/amd64
      # v8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: garmin-hass-native-aarch64
          path: .tmp/native/aarch64
      # v8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: garmin-hass-sources-amd64
          path: .tmp/sources/amd64
      # v8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: garmin-hass-sources-aarch64
          path: .tmp/sources/aarch64
      - name: Stage and qualify the candidate in HAOS
        id: identity
        env:
          MODE: ${{ github.ref_type == 'branch' && 'preflight' || 'draft' }}
        run: nix run .#hass-ci -- "$MODE"
      - uses: ./.github/actions/attest
        with:
          checksums: .tmp/publication/candidate/SHA256SUMS
          bundle: .tmp/bundles/artifacts.sigstore.jsonl
      - uses: ./.github/actions/attest
        with:
          path: .tmp/publication/candidate/SHA256SUMS
          bundle: .tmp/bundles/checksums.sigstore.jsonl
      - uses: ./.github/actions/attest
        with:
          name: ${{ steps.identity.outputs.image }}
          digest: ${{ steps.identity.outputs.index }}
          registry: "true"
          bundle: ${{ steps.identity.outputs.index_bundle }}
      - uses: ./.github/actions/attest
        with:
          name: ${{ steps.identity.outputs.image }}
          digest: ${{ steps.identity.outputs.manifest }}
          registry: "true"
          bundle: ${{ steps.identity.outputs.manifest_bundle }}
      - uses: ./.github/actions/attest
        with:
          name: ${{ steps.identity.outputs.image }}
          digest: ${{ steps.identity.outputs.arm64_manifest }}
          registry: "true"
          bundle: ${{ steps.identity.outputs.arm64_manifest_bundle }}
      - uses: ./.github/actions/attest
        with:
          path: .tmp/publication/haos-acceptance.tar.gz
          bundle: .tmp/bundles/acceptance.sigstore.jsonl
      - name: Verify signed candidate
        run: nix run .#hass-ci -- complete
      # v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.ref_type == 'branch'
        with:
          name: hass-branch-preflight
          path: |
            .tmp/publication/candidate/
            .tmp/publication/haos-acceptance.tar.gz
            .tmp/bundles/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      # v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hass-publication-evidence
          path: |
            .tmp/publication/*.json
            .tmp/publication/haos-acceptance.tar.gz
            .tmp/sources/**/dependency-sources.json
            .tmp/lifecycle-acceptance/
            .tmp/staged-acceptance/
          if-no-files-found: ignore
          retention-days: 7
      - name: Recover unfinished promotion and remove credentials and candidate branch
        if: always()
        run: bash infra/ci/runner.sh cleanup
  verify-preflight:
    needs: release
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      TMPDIR: ${{ github.workspace }}/.tmp/runner-tmp
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nix
      # v8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: hass-branch-preflight
          path: .tmp/
      - name: Verify independent branch downloads
        run: nix run .#hass-ci -- verify-preflight
      # v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hass-preflight-verification
          path: .tmp/publication/preflight-verification.json
          if-no-files-found: error
          retention-days: 7
  promote:
    if: github.repository == 'kubijo/garmin-toolkit' && inputs.publish && !inputs.recovery && inputs.arm64_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      DOCKER_CONFIG: ${{ github.workspace }}/.tmp/docker-auth
      REGISTRY_AUTH_FILE: ${{ github.workspace }}/.tmp/docker-auth/config.json
      TMPDIR: ${{ github.workspace }}/.tmp/runner-tmp
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nix
        with:
          kvm: "true"
          haos: all
      - name: Promote the signed draft and verify advertised installation
        run: nix run .#hass-ci -- promote
      # v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hass-promotion-evidence
          path: |
            .tmp/publication/*.json
            .tmp/final-acceptance/
          if-no-files-found: ignore
          retention-days: 7
      - name: Recover unfinished promotion and remove credentials and candidate branch
        if: always()
        run: bash infra/ci/runner.sh cleanup
  recovery:
    if: github.repository == 'kubijo/garmin-toolkit' && inputs.recovery && inputs.arm64_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nix
      - name: Exercise isolated GitHub and GHCR recovery fixtures
        run: nix run .#hass-recovery -- run
      - name: Remove owned fixtures and credentials
        if: always()
        run: bash infra/ci/runner.sh recovery-cleanup
      # v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hass-recovery-evidence
          path: |
            .tmp/recovery/*.json
            .tmp/recovery/store/result.json
            .tmp/recovery/store/*/promotion.json
          if-no-files-found: ignore
          retention-days: 7
  arm64-delivery:
    if: inputs.arm64_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      DOCKER_CONFIG: ${{ github.workspace }}/.tmp/docker-auth
      REGISTRY_AUTH_FILE: ${{ github.workspace }}/.tmp/docker-auth/config.json
      TMPDIR: ${{ github.workspace }}/.tmp/runner-tmp
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nix
        with:
          haos: aarch64-linux
      - name: Qualify retained ARM64 image through staged Git and GHCR delivery
        env:
          SOURCE_RUN: ${{ inputs.arm64_run }}
          PUBLISH: ${{ inputs.publish }}
          RECOVERY: ${{ inputs.recovery }}
        run: nix run .#hass-ci -- delivery --system aarch64-linux --source-run "$SOURCE_RUN"
      - name: Remove credentials and owned candidate branch
        if: always()
        run: bash infra/ci/runner.sh cleanup
      # v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hass-arm64-delivery
          path: |
            .tmp/publication/registry/registry.json
            .tmp/publication/staged-registry/registry.json
            .tmp/publication/staging.json
            .tmp/publication/delivery.json
            .tmp/native-acceptance/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
