[workspace]
resolver = "3"
members = [
  "apps/garmin-cli",
  "apps/garmin-cli/tui",
  "apps/garmin-desktop",
  "apps/garmin-hass",
  "apps/garmin-hass/web",
  "crates/garmin-brand",
  "crates/garmin-capture",
  "crates/garmin-color",
  "crates/garmin-device",
  "crates/garmin-fit",
  "crates/garmin-fixtures",
  "crates/garmin-gpx",
  "crates/garmin-i18n",
  "crates/garmin-importer",
  "crates/garmin-map-service",
  "crates/garmin-macros",
  "crates/garmin-model",
  "crates/garmin-progress",
  "crates/garmin-route",
  "crates/garmin-service-api",
  "crates/garmin-services",
  "crates/garmin-simulator",
  "crates/garmin-storage",
  "crates/garmin-ui",
  "crates/garmin-update",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/kubijo/garmin-toolkit"
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
async-trait = "=0.1.92"
axum = "=0.8.9"
base64 = "=0.23.1"
blake3 = "=1.8.7"
byte-unit = "=5.2.5"
bytes = "=1.12.1"
cint = "=0.3.1"
clap = { version = "=4.6.6", features = ["derive"] }
comrak = { version = "=0.54.0", default-features = false }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
dirs = "=6.0.0"
eframe = { version = "=0.36.2", default-features = false }
egui = { version = "=0.36.2", default-features = false, features = ["cint"] }
egui_extras = { version = "=0.36.2", default-features = false, features = ["image", "svg"] }
embedded-io-adapters = { version = "=0.7.0", features = ["std"] }
formatjs_intl = "=0.5.0"
fs2 = "=0.4.3"
futures-lite = "=2.6.1"
futures-util = "=0.3.34"
geo-types = "=0.7.20"
geographiclib-rs = { version = "=0.2.7", default-features = false }
garmin-brand = { version = "0.1.0", path = "crates/garmin-brand" }
garmin-capture = { version = "0.1.0", path = "crates/garmin-capture" }
garmin-cli-tui = { version = "0.1.0", path = "apps/garmin-cli/tui" }
garmin-color = { version = "0.1.0", path = "crates/garmin-color" }
garmin-device = { version = "0.1.0", path = "crates/garmin-device" }
garmin-fit = { version = "0.1.0", path = "crates/garmin-fit" }
garmin-fixtures = { version = "0.1.0", path = "crates/garmin-fixtures" }
garmin-gpx = { version = "0.1.0", path = "crates/garmin-gpx" }
garmin-i18n = { version = "0.1.0", path = "crates/garmin-i18n" }
garmin-importer = { version = "0.1.0", path = "crates/garmin-importer" }
garmin-map-service = { version = "0.1.0", path = "crates/garmin-map-service" }
garmin-macros = { version = "0.1.0", path = "crates/garmin-macros" }
garmin-model = { version = "0.1.0", path = "crates/garmin-model" }
garmin-progress = { version = "0.1.0", path = "crates/garmin-progress" }
garmin-route = { version = "0.1.0", path = "crates/garmin-route" }
garmin-service-api = { version = "0.1.0", path = "crates/garmin-service-api" }
garmin-services = { version = "0.1.0", path = "crates/garmin-services" }
garmin-simulator = { version = "0.1.0", path = "crates/garmin-simulator" }
garmin-storage = { version = "0.1.0", path = "crates/garmin-storage" }
garmin-ui = { version = "0.1.0", path = "crates/garmin-ui" }
garmin-update = { version = "0.1.0", path = "crates/garmin-update" }
gio = "=0.22.9"
gpx-format = { package = "gpx", version = "=0.10.0" }
har = "=0.9.0"
hex = "=0.4.3"
http-security-headers = "=0.5.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
indoc = "=2.0.7"
js-sys = "=0.3.103"
jiff = { version = "=0.2.35", default-features = false, features = ["std", "tz-system"] }
md-5 = "=0.11.0"
mediatype = "=0.23.0"
miette = { git = "https://github.com/zkat/miette", rev = "e853bbf9bc78bbe0b225995de54a3108d77dcaf8", default-features = false }
mtp-rs = "=0.32.0"
newtype-uuid = { version = "=1.4.0", features = ["serde", "v4"] }
nusb = { version = "=0.2.7", features = ["tokio"] }
nu-ansi-term = "=0.50.3"
palette = { version = "=0.7.7", default-features = false, features = ["std"] }
phosphor-svgs = "=0.3.0"
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
proc-macro2 = "=1.0.107"
quick-xml = { version = "=0.42.0", features = ["serialize"] }
quote = "=1.0.47"
ratatui = { version = "=0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-interact = "=0.5.3"
remoc = { version = "=0.20.1", default-features = false, features = ["rtc"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
rfd = "=0.17.2"
resvg = { version = "=0.45.1", default-features = false }
rustyfit = "=0.10.2"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["macros", "migrate", "runtime-smol", "sqlite-bundled"] }
sys-locale = "=0.3.2"
syn = "=3.0.5"
tempfile = "=3.27.0"
termcolor = "=1.4.1"
termcolor-json = "=1.0.0"
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["formatting"] }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "=0.29.0"
toml_edit = "=0.25.13"
tower-http = "=0.6.11"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-logfmt = { version = "=0.3.7", features = ["ansi_logs"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
url = { version = "=2.5.8", features = ["serde"] }
usvg = { version = "=0.45.1", default-features = false }
uuid = { version = "=1.26.0", features = ["serde", "v4", "v5"] }
walkdir = "=2.5.0"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
web-sys = "=0.3.103"
websocket-web = "=0.1.9"
winit = { version = "=0.30.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
