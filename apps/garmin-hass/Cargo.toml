[package]
name = "garmin-hass"
description = "Garmin Toolkit native host for Home Assistant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
demo = ["dep:garmin-fixtures"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
blake3.workspace = true
clap.workspace = true
futures-lite.workspace = true
futures-util.workspace = true
garmin-device.workspace = true
garmin-fit.workspace = true
garmin-fixtures = { workspace = true, optional = true }
garmin-importer.workspace = true
garmin-map-tiles.workspace = true
garmin-model.workspace = true
garmin-progress.workspace = true
garmin-service-api.workspace = true
garmin-services.workspace = true
garmin-storage.workspace = true
http-security-headers = { workspace = true, features = ["nonce"] }
nu-ansi-term.workspace = true
remoc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-logfmt.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
garmin-fit = { workspace = true, features = ["test-fixtures"] }
garmin-fixtures.workspace = true
image.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
