<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Garmin Toolkit</title>
        <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, sans-serif;
        }
        html,
        body,
        canvas {
            width: 100%;
            height: 100%;
            margin: 0;
        }
        body {
            overflow: hidden;
            background: #0b0e13;
            color: #f4f7fa;
        }
        canvas {
            display: block;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-content: center;
            gap: 0.75rem;
            padding: 2rem;
            background: #0b0e13;
            text-align: center;
        }
        #loading[aria-busy="false"] progress {
            display: none;
        }
        progress {
            width: min(28rem, 75vw);
            accent-color: #43b7dd;
        }
        #loading-detail {
            color: #abb6c3;
            font-variant-numeric: tabular-nums;
        }
        #loading-trace {
            max-width: 42rem;
            color: #7f8a98;
            font-size: 0.8rem;
        }
        </style>
    </head>
    <body>
        <canvas id="garmin-toolkit"></canvas>
        <main id="loading" aria-live="polite" aria-busy="true">
            <strong id="loading-message">Loading Garmin Toolkit…</strong>
            <progress id="loading-progress"></progress>
            <span id="loading-detail">Preparing download…</span>
            <span id="loading-trace"></span>
        </main>
        <script type="module" src="./initializer.js"></script>
    </body>
</html>
