[package]
name = "garmin-hass-web"
description = "Garmin Toolkit Home Assistant browser client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytes.workspace = true
camino.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
futures-util.workspace = true
garmin-i18n.workspace = true
garmin-model.workspace = true
garmin-service-api.workspace = true
garmin-ui = { workspace = true, features = ["automation"] }
js-sys.workspace = true
image.workspace = true
rfd = { workspace = true, features = ["file-handle-inner"] }
remoc = { workspace = true, features = ["js"] }
serde.workspace = true
serde_json.workspace = true
tokio-wasm-io.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Blob", "BroadcastChannel", "Crypto", "Url", "UrlSearchParams", "CustomEvent", "CustomEventInit", "CssStyleDeclaration", "Document", "Element", "ErrorEvent", "File", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "HtmlLinkElement", "Location", "MessageEvent", "Node", "OffscreenCanvas", "Performance", "Response", "Window", "Worker", "WorkerOptions", "WorkerType", "console"] }
websocket-web.workspace = true

[lints]
workspace = true

[dev-dependencies]
garmin-service-api.workspace = true
garmin-model.workspace = true
garmin-ui = { workspace = true, features = ["automation"] }
serde.workspace = true
serde_json.workspace = true
