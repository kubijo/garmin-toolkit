[package]
name = "garmin-hass-web"
description = "Garmin Toolkit Home Assistant browser client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytes.workspace = true
eframe = { workspace = true, features = ["default_fonts", "glow"] }
futures-util.workspace = true
garmin-i18n.workspace = true
garmin-model.workspace = true
garmin-service-api.workspace = true
garmin-ui.workspace = true
js-sys.workspace = true
remoc = { workspace = true, features = ["js"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "HtmlCanvasElement", "Location", "Window", "console"] }
websocket-web.workspace = true

[lints]
workspace = true
