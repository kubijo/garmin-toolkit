syntax = "proto2";

package GDI.Proto.FileAccess;

import "garmin/gdi_data_types.proto";

message CancelTransferRequest {
  optional uint32 transfer_handle = 1;
}

message CancelTransferResponse {
  enum Status {
    SUCCESS = 0;
    UNKNOWN_TRANSFER = 1;
  }

  optional GDI.Proto.FileAccess.CancelTransferResponse.Status status = 1;
}

message Capabilities {
  enum ChecksumMethod {
    NOT_SUPPORTED = 0;
    TRUNCATED_MD5 = 1;
  }

  optional bool server_push_file_bundle_support = 1;
  optional bool software_update_part_number_request_support = 2;
  optional GDI.Proto.FileAccess.Capabilities.ChecksumMethod server_file_checksum_method = 3;
  optional uint32 checksum_max_file_size_byte = 4;
  optional bool custom_flag_support = 5;
}

message DataType {
  enum Format {
    GDXML_DATA_TYPE = 0;
    SOFTWARE_UPDATE = 1;
    SPECIAL_CASE = 2;
    GDXML_FULL_FILE = 3;
    DATA_XFER = 4;
    GDXML_UPDATE_FILE = 5;
  }

  enum SpecialCase {
    COUNTER_BYTE_TEST = 1;
  }

  optional GDI.Proto.FileAccess.DataType.Format format = 1;
  optional string gdxml_string = 2;
  optional uint32 gdxml_string_key = 3;
  optional string gdxml_file_identifier = 4;
  optional string software_update_path = 5;
  optional GDI.Proto.FileAccess.DataType.SpecialCase special_case = 6;
  optional string update_part_number = 7;
}

message DeleteItemRequest {
  optional GDI.Proto.DataTypes.UUID uid = 1;
  optional GDI.Proto.FileAccess.TransferDirection direction = 2;
}

message DeleteItemResponse {
  enum Result {
    SUCCESS = 0;
    ITEM_DOES_NOT_EXIST = 1;
    ITEM_CANNOT_BE_DELETED = 2;
    TRANSFER_IN_PROGRESS = 3;
    DELETE_FAILED = 4;
    INVALID_PARAMS = 5;
    OPERATION_NOT_SUPPORTED = 6;
  }

  optional GDI.Proto.FileAccess.DeleteItemResponse.Result result = 1;
  optional uint32 error_code = 2;
  optional uint32 error_source = 3;
}

message GetItemChecksumRequest {
  optional GDI.Proto.DataTypes.UUID uid = 1;
}

message GetItemChecksumResponse {
  enum Result {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    FAIL_ITEM_DOES_NOT_EXIST = 2;
    FAIL_ITEM_SIZE_TOO_LARGE = 3;
    FAIL_INTERNAL_ERROR = 4;
    FAIL_DEVICE_IS_BUSY = 5;
  }

  optional GDI.Proto.DataTypes.UUID uid = 1;
  optional GDI.Proto.FileAccess.GetItemChecksumResponse.Result result = 2;
  optional fixed64 checksum_truncated_md5 = 3;
}

enum ItemAccessResult {
  SUCCESS = 0;
  ITEM_TYPE_NOT_SUPPORTED = 1;
  NO_SUPPORTED_TRANSPORT = 2;
  NO_AVAILABLE_RESOURCES = 3;
  INTERNAL_ERROR = 4;
  INVALID_PARAMS = 5;
  INVALID_OFFSET = 6;
  AMBIGUOUS_DATA_TYPE = 7;
  UNKNOWN_ITEM = 8;
  NO_SPACE = 9;
  DATA_TYPE_ERROR = 10;
  CONFLICTING_PUSH_REQUEST = 11;
}

message ItemAddedNotification {
  repeated GDI.Proto.FileAccess.ItemReference items = 1 [packed = false];
}

message ItemListCancelNotification {
  optional uint32 session_id = 1;
}

message ItemListRequest {
  enum MetaDataType {
    MODIFIED_TIME = 0;
  }

  optional uint32 session_id = 1;
  optional uint32 transaction_id = 2;
  optional uint32 max_item_count = 3;
  repeated GDI.Proto.DataTypes.UUID exclude_all_flags = 4 [packed = false];
  repeated GDI.Proto.DataTypes.UUID get_flags = 5 [packed = false];
  repeated GDI.Proto.FileAccess.DataType included_data_types = 6 [packed = false];
  repeated GDI.Proto.FileAccess.ItemListRequest.MetaDataType requested_metadata = 7 [packed = false];
}

message ItemListResponse {
  enum Status {
    SUCCESS = 0;
    FAIL_UNKNOWN_SESSION_ID = 1;
    FAIL_TOO_MANY_EXCLUDE_FLAGS = 2;
    FAIL_TOO_MANY_GET_FLAGS = 3;
    FAIL_OTHER = 4;
    FAIL_TOO_MANY_INCLUDE_TYPES = 5;
    FAIL_INVALID_DATA_TYPE = 6;
  }

  optional GDI.Proto.FileAccess.ItemListResponse.Status status = 1;
  optional uint32 session_id = 2;
  optional uint32 next_transaction_id = 3;
  repeated GDI.Proto.FileAccess.ItemReference items = 4 [packed = false];
  optional uint32 error_code = 5;
  optional uint32 abandoned_session_id = 6;
  optional GDI.Proto.FileAccess.DataType malformed_data_type = 7;
}

message ItemReference {
  enum Urgency {
    IMMEDIATE = 0;
    NORMAL = 1;
    SLOW = 2;
  }

  optional GDI.Proto.DataTypes.UUID uid = 1;
  optional GDI.Proto.FileAccess.DataType data_type = 2;
  optional uint64 data_size = 3;
  optional uint32 requested_flags = 4;
  optional uint32 transaction_id = 5;
  optional GDI.Proto.FileAccess.ItemReference.Urgency urgency = 6;
  optional uint32 modified_time = 7;
}

message ItemUpdatedNotification {
  optional GDI.Proto.DataTypes.UUID uid = 1;
  repeated GDI.Proto.DataTypes.UUID changed_flags_set = 2 [packed = false];
  repeated GDI.Proto.DataTypes.UUID changed_flags_clear = 3 [packed = false];
}

message ModifyFlagsRequest {
  optional GDI.Proto.DataTypes.UUID uid = 1;
  repeated GDI.Proto.DataTypes.UUID set_flags = 2 [packed = false];
  repeated GDI.Proto.DataTypes.UUID clear_flags = 3 [packed = false];
}

message ModifyFlagsResponse {
  enum Status {
    SUCCESS = 0;
    FAIL_ITEM_NOT_PROVIDED = 1;
    FAIL_ITEM_NOT_FOUND = 2;
    FAIL_FLAGS_NOT_PROVIDED = 3;
    FAIL_MAX_FLAGS_REACHED = 4;
    FAIL_OTHER = 5;
  }

  optional GDI.Proto.FileAccess.ModifyFlagsResponse.Status status = 1;
  optional uint32 error_source = 2;
  optional uint32 error_code = 3;
}

message PriorityUpdateRequest {
  optional uint32 transfer_handle = 1;
  optional uint32 new_priority = 2;
}

message PriorityUpdateResponse {
  enum Status {
    SUCCESS = 0;
    INVALID_PRIORITY = 1;
    UNKNOWN_TRANSFER = 2;
  }

  optional GDI.Proto.FileAccess.PriorityUpdateResponse.Status status = 1;
}

message PullItemDataRequest {
  optional GDI.Proto.FileAccess.ItemReference item = 1;
  optional uint32 priority = 2;
  repeated GDI.Proto.FileAccess.TransportProtocol supported_transports = 3 [packed = false];
  optional uint64 offset = 4;
  optional uint32 requested_compression_window = 5;
}

message PullItemDataResponse {
  optional GDI.Proto.FileAccess.ItemAccessResult result = 1;
  optional GDI.Proto.FileAccess.TransportProtocol transport = 2;
  optional uint32 transfer_handle = 3;
  optional string file_path = 4;
  optional sint32 error_code = 5;
  optional uint32 error_source = 6;
  optional uint32 compression_window = 7;
  optional uint32 data_specific_error_source = 8;
  optional sint32 data_specific_error_code = 9;
}

message PushItemDataRequest {
  optional GDI.Proto.FileAccess.ItemReference item = 1;
  optional uint32 priority = 2;
  repeated GDI.Proto.FileAccess.TransportProtocol supported_transports = 3 [packed = false];
  optional uint32 requested_compression_window = 4;
}

message PushItemDataResponse {
  optional GDI.Proto.FileAccess.ItemAccessResult result = 1;
  optional uint64 offset = 2;
  optional GDI.Proto.FileAccess.TransportProtocol transport = 3;
  optional uint32 transfer_handle = 4;
  optional string file_path = 5;
  optional sint32 error_code = 6;
  optional uint32 error_source = 7;
  optional uint32 compression_window = 8;
  optional uint32 data_specific_error_source = 9;
  optional sint32 data_specific_error_code = 10;
}

message ResourceUpdateNotification {
  enum Status {
    CURRENT_PRIORITY_LOWERED = 1;
    FILE_SPACE_FREED = 2;
  }

  optional GDI.Proto.FileAccess.ResourceUpdateNotification.Status status = 1;
  optional uint32 current_priority = 2;
}

message Service {
  optional GDI.Proto.FileAccess.PullItemDataRequest pull_item_request = 1;
  optional GDI.Proto.FileAccess.PullItemDataResponse pull_item_response = 2;
  optional GDI.Proto.FileAccess.PushItemDataRequest push_item_request = 3;
  optional GDI.Proto.FileAccess.PushItemDataResponse push_item_response = 4;
  optional GDI.Proto.FileAccess.TransferStatusRequest transfer_status_request = 5;
  optional GDI.Proto.FileAccess.PriorityUpdateRequest priority_update_request = 6;
  optional GDI.Proto.FileAccess.PriorityUpdateResponse priority_update_response = 7;
  optional GDI.Proto.FileAccess.ItemListRequest item_list_request = 9;
  optional GDI.Proto.FileAccess.ItemListResponse item_list_response = 10;
  optional GDI.Proto.FileAccess.ItemListCancelNotification item_list_cancel_notification = 11;
  optional GDI.Proto.FileAccess.ItemAddedNotification item_added_notification = 12;
  optional GDI.Proto.FileAccess.DeleteItemRequest delete_item_request = 13;
  optional GDI.Proto.FileAccess.DeleteItemResponse delete_item_response = 14;
  optional GDI.Proto.FileAccess.ModifyFlagsRequest modify_flags_request = 15;
  optional GDI.Proto.FileAccess.ModifyFlagsResponse modify_flags_response = 16;
  optional GDI.Proto.FileAccess.ItemUpdatedNotification item_updated_notification = 17;
  optional GDI.Proto.FileAccess.CancelTransferRequest cancel_transfer_request = 18;
  optional GDI.Proto.FileAccess.CancelTransferResponse cancel_transfer_response = 19;
  optional GDI.Proto.FileAccess.ResourceUpdateNotification resource_update_notification = 20;
  optional GDI.Proto.FileAccess.TransferStatusResponse transfer_status_response = 21;
  optional GDI.Proto.FileAccess.SyncButtonNotification sync_button_notification = 22;
  optional GDI.Proto.FileAccess.SoftwareUpdatePartNumberRequest software_update_part_number_request = 23;
  optional GDI.Proto.FileAccess.SoftwareUpdatePartNumberResponse software_update_part_number_response = 24;
  optional GDI.Proto.FileAccess.GetItemChecksumRequest get_item_checksum_request = 25;
  optional GDI.Proto.FileAccess.GetItemChecksumResponse get_item_checksum_response = 26;
}

message SoftwareUpdatePartNumberRequest {
  enum Requestor {
    DISPLAY = 0;
    APP = 1;
  }

  optional GDI.Proto.FileAccess.SoftwareUpdatePartNumberRequest.Requestor requestor = 1;
}

message SoftwareUpdatePartNumberResponse {
  repeated string part_number = 1 [packed = false];
}

message SyncButtonNotification {}

enum TransferDirection {
  PUSH = 0;
  PULL = 1;
}

enum TransferPriorityLevel {
  LOWEST_START = 0;
  LOWEST_END = 9;
  UTILITY_START = 10;
  UTILITY_END = 19;
  STANDARD_START = 20;
  STANDARD_END = 29;
  USER_INITIATED_START = 30;
  USER_INITIATED_END = 39;
  HIGHEST_START = 40;
  HIGHEST_END = 49;
}

message TransferStatusRequest {
  enum FailureReason {
    TRANSPORT_FAILED = 0;
    HIGHER_PRIORITY_REQUEST_RECEIVED = 1;
    ITEM_DELETED = 2;
    CANCELLED_BY_CLIENT = 3;
    CANCELLED_BY_DEVICE = 4;
    COMPRESSION_FAILED = 5;
  }

  optional GDI.Proto.DataTypes.UUID uid = 1;
  optional uint32 transfer_handle = 2;
  optional GDI.Proto.FileAccess.TransferStatusRequest.FailureReason failure_reason = 3;
  optional uint32 transport_status = 4;
  optional uint32 transport_provider_id = 5;
  optional uint32 transport_error_code = 6;
  optional uint32 new_priority = 7;
}

message TransferStatusResponse {
  optional uint32 next_transfer_priority = 1;
}

enum TransportProtocol {
  MULTILINK_TRANSPORT_PIPE = 0;
}
