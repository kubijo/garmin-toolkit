[package]
name = "garmin-device"
description = "Garmin discovery, manifests, transports, and device file operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
gfdi-smoke = ["dep:garmin-gfdi", "dep:bluer", "dep:garmin-fit", "garmin-fit/test-fixtures", "dep:flate2", "dep:buffa"]

[[example]]
name = "gfdi-smoke"
required-features = ["gfdi-smoke"]

[dependencies]
garmin-model.workspace = true
garmin-gfdi = { workspace = true, optional = true }
garmin-fit = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
buffa = { workspace = true, optional = true }
async-trait.workspace = true
bytes.workspace = true
camino.workspace = true
futures-lite.workspace = true
futures-util.workspace = true
fs2.workspace = true
garmin-progress.workspace = true
hex.workspace = true
mtp-rs.workspace = true
nusb.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
walkdir.workspace = true
zip.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { workspace = true, optional = true }
gio.workspace = true

[dev-dependencies]
clap.workspace = true
tokio = { workspace = true, features = ["test-util"] }
indoc.workspace = true
mtp-rs = { workspace = true, features = ["virtual-device"] }
tempfile.workspace = true

[lints]
workspace = true
